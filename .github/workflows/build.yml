name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The signing key is committed encrypted; KEYSTORE_PASSWORD (repo secret) unlocks it.
      - name: Unlock signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repo secret KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keystore/eyedrops.jks.enc -out keystore/eyedrops.jks -pass env:KEYSTORE_PASSWORD

      - name: Build
        env:
          UPDATE_BASE: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | sed 's/^/::error::/' || true

      - name: Prepare files
        run: |
          cp app/build/outputs/apk/release/app-release.apk EyeDrops.apk
          sha=$(sha256sum EyeDrops.apk | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "1.0.%s", "apk": "EyeDrops.apk", "sha256": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$sha" > version.json
          rm -f keystore/eyedrops.jks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EyeDrops 1.0.${{ github.run_number }}
          files: |
            EyeDrops.apk
            version.json
          make_latest: true
